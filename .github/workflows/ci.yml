name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install static test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
          python -m pip install -e ".[runtime]"
      - name: Rust quality
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Native dependency notices
        run: python scripts/collect_sdk_notices.py --check
      - name: Native dependency security
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock
      - name: Ruff
        run: ruff check src tests scripts
      - name: SDK public typing
        run: mypy --config-file mypy-sdk.ini
      - name: Full static, API, runtime, and workstation suite
        run: pytest -q tests rust/aniflive-tts-python/tests
      - name: Release security gate
        run: python scripts/check_release_security.py --expected-version 1.5.0b1
