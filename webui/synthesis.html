    function normalizeGenerationSettings(values) {
      const seed = Number(values.seed);
      const topK = Number(values.top_k);
      const temperature = Number(values.temperature);
      const noiseScale = Number(values.noise_scale);
      if (!Number.isInteger(seed) || seed < -1 || seed > 2147483647) {
        throw new RangeError("seed must be an integer from -1 to 2147483647");
      }
      if (!Number.isInteger(topK) || topK < 1 || topK > 50) {
        throw new RangeError("top_k must be an integer from 1 to 50");
      }
      if (!Number.isFinite(temperature) || temperature < .01 || temperature > 5) {
        throw new RangeError("temperature must be from 0.01 to 5");
      }
      if (!Number.isFinite(noiseScale) || noiseScale < 0 || noiseScale > 10) {
        throw new RangeError("noise_scale must be from 0 to 10");
      }
      return {
        seed,
        top_k: topK,
        temperature,
        noise_scale: noiseScale,
        speed: 1.0
      };
    }
    function buildSpeechRequest({ text, segments, language, model, generation }) {
      const hasSegments = Array.isArray(segments) && segments.length > 0;
      const payload = {
        language,
        model,
        generation: { ...generation, speed: 1.0 }
      };
      if (hasSegments) payload.segments = segments;
      else payload.text = text;
      return payload;
    }

    }
    function buildSessionPlan({ records, defaultLanguage, settings = {}, generation }) {
      const languages = new Set(["zh", "yue", "en", "ja", "ko"]);
      if (!languages.has(defaultLanguage)) throw new RangeError("Unsupported default language");
      if (!Array.isArray(records) || !records.length) {
        throw new RangeError("A speech session needs at least one segment");
      }
      const expectedText = records.map(record => String(record.text || "")).join("");
      const segments = [];
      let pendingWhitespace = "";
      for (const record of records) {
        const rawText = String(record.text || "");
        const configured = settings[record.key] || {};
        const language = configured.language || defaultLanguage;
        if (!languages.has(language)) throw new RangeError("Unsupported segment language");
        const pauseAfterMs = normalizePauseMilliseconds(configured.pause_after_ms ?? 0);
        if (!rawText.trim()) {
          if (segments.length) segments[segments.length - 1].text += rawText;
          else pendingWhitespace += rawText;
          continue;
        }
        segments.push({
          segment_id: `seg_${String(segments.length + 1).padStart(2, "0")}`,
          text: pendingWhitespace + rawText,
          language,
          expression_prompt: record.expression_prompt || null,
          generation: { ...generation, speed: 1.0 },
          paragraph_id: "webui_paragraph_1",
          pause_after_ms: pauseAfterMs
        });
        pendingWhitespace = "";
      }
      if (!segments.length) throw new RangeError("Session text must contain visible characters");
      if (pendingWhitespace) segments[segments.length - 1].text += pendingWhitespace;
      if (segments.length > 64) throw new RangeError("A speech session supports at most 64 segments");
      if (segments.map(segment => segment.text).join("") !== expectedText) {

      let saved = "";

        locale.startsWith("zh-tw") ||
        locale.startsWith("zh-hk") ||
        locale.startsWith("zh-mo")

      return "zh-Hant";
    }

    function profileColor(profile) {
      const knownProfiles = Object.keys(PROFILE_LABELS);
      const known = knownProfiles.indexOf(profile);
      if (known >= 0) return ANNOTATION_COLORS[known % ANNOTATION_COLORS.length];
      const unknownProfiles = (Array.isArray(state.expressions.profiles) ? state.expressions.profiles : [])
        .map(record => record?.id)
        .filter(id => typeof id === "string" && !knownProfiles.includes(id))
        .sort();
      const slot = knownProfiles.length + Math.max(0, unknownProfiles.indexOf(profile));
      if (slot < ANNOTATION_COLORS.length) return ANNOTATION_COLORS[slot];
      let hue = (slot * 137.508 + 11) % 360;

    function editorSegmentRecords() {

      let previousAnnotationId = "start";
      const annotations = annotationEditor.sortedAnnotations();
      for (const annotation of annotations) {
        if (annotation.start > cursor) {
          records.push({
            key: `plain:${previousAnnotationId}:${annotation.id}`,
            text: text.slice(cursor, annotation.start),
            annotation: null,
            annotationId: null,
            expression_prompt: null

        }
        records.push({
          key: `annotation:${annotation.id}`,
          text: text.slice(annotation.start, annotation.end),
          annotation,
          annotationId: annotation.id,
          expression_prompt: annotation.prompt
        });
        cursor = annotation.end;
        previousAnnotationId = annotation.id;
      }
      if (cursor < text.length) {
        records.push({
          key: `plain:${previousAnnotationId}:end`,
          text: text.slice(cursor),
          annotation: null,
          annotationId: null,
          expression_prompt: null

            !used.has(value)
            && value.annotationId === record.annotationId

        if (!match) {

            !used.has(value)
            && value.annotationId === null
            && value.text === record.text

        const source = match?.[1];
        if (source) used.add(source);
        next.set(record.key, {
          language: source?.language || null,
          pauseAfterMs: Number.isInteger(source?.pauseAfterMs) ? source.pauseAfterMs : 0,

        defaultLanguage: state.language,

        cursor += record.text.length;

          record.annotation.end = cursor;

      if (reordered.every((record, index) => record === records[index])) return;
      for (let index = 0; index < reordered.length - 1; index += 1) {

    function renderSegmentSequence() {

        let maximum = -1;

          maximum = Math.max(maximum, peaks[index][1]);

        context.moveTo(x + .5, center - maximum * amplitude);
        context.lineTo(x + .5, center - minimum * amplitude);

        });
        const data = await response.json();
        if (!response.ok || !data.ready) throw new Error(data.error || `HTTP ${response.status}`);
        applyStatus(data);
        setStatus("statusActivated", "", { model: state.model });
      } catch (error) {
        renderModels();
        const translated = localizedError(error);
        setStatus(translated.key, "error", translated.vars || {});
      } finally {
        state.switching = false;
        el("progress").classList.remove("active");
        annotationEditor.setDisabled(false);
        updatePlayAvailability();
        el("modelButton").disabled = state.models.length < 2;
      }
    }

    applyTranslations();
    renderPcmWaveform();
    fetch("/api/status", { cache: "no-store" }).then(async response => {
      const data = await response.json();
      if (!response.ok || !data.ready) {
        if (data.error) throw new Error(data.error);
        throw i18nError("errorServiceNotReady");
      }
      applyStatus(data);
      setStatus("statusApiReady", "", { model: state.model, version: state.apiVersion });
    }).catch(error => {
      const translated = localizedError(error);
      setStatus(translated.key, "error", translated.vars || {});
    });
  </script>

  <script>
  (() => {
    if (!document.body.classList.contains("embedded")) return;
    const saved = {};
    for (const [selector, name] of [[".generation-inspector", "generation"], [".ab-inspector", "blindComparison"]]) {
      const section = document.querySelector(selector);
      if (!section) continue;
      const details = document.createElement("details");
      details.className = "ux-synthesis-details";
      details.dataset.disclosure = name;
      details.open = saved[name] === true;
      const summary = document.createElement("summary");
      const originalTitle = section.querySelector(".inspector-heading span");
      if (originalTitle) {
        const title = originalTitle.cloneNode(true);
        title.removeAttribute("id");
        summary.append(title);
      }
      const preview = document.createElement("span");
      preview.className = "ux-synthesis-preview";
      preview.setAttribute("aria-hidden", "true");
      summary.append(preview);
      section.before(details);
      details.append(summary, section);
      const update = () => {
        const inputs = [...section.querySelectorAll("input")];
        preview.textContent = inputs.map(input => {
          const label = section.querySelector('label[for="' + input.id + '"]');
          return label ? label.textContent.trim() + ": " + input.value : "";
        }).filter(Boolean).join(" · ");
      };
      details.addEventListener("toggle", () => {
        saved[name] = details.open;
        update();
      });
      section.addEventListener("input", update);
      update();
    }
    const editor = document.querySelector(".editor");
    const originalOrder = [...editor.children];
    const mobile = matchMedia("(max-width: 860px)");
    const arrange = () => {
      originalOrder.forEach(node => editor.append(node));
      const before = editor.querySelector(".expression-field");
      for (const selector of [".lang-row", ".actions", ".status", ".progress"]) {
        const node = editor.querySelector(selector);
        if (node && before) editor.insertBefore(node, before);
      }
    };
    mobile.addEventListener("change", arrange);
    arrange();
    document.addEventListener("invalid", event => {
      const details = event.target.closest?.(".ux-synthesis-details");
      if (details) details.open = true;
    }, true);
  })();
  </script>

</body>
</html>
