<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09070e">
  <title>AnifLive-TTS WebUI</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #09070e;
      --night-soft: #100c17;
      --panel: rgba(23,17,31,.9);
      --panel-strong: rgba(31,22,41,.96);
      --panel-soft: rgba(48,34,59,.58);
      --text: #faf4fb;
      --muted: #b2a6ba;
      --faint: #817588;
      --line: rgba(225,199,234,.14);
      --line-strong: rgba(235,194,219,.3);
      --ivory: #efdbea;
      --lilac: #bba5dc;
      --rose: #d890b5;
      --wine: #8d3155;
      --candle: #edc98e;
      --playback-gold: #ffd166;
      --danger: #ff91a5;
      --shadow: 0 18px 48px rgba(0,0,0,.28);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 9px;

    * { box-sizing: border-box; }
    html { background: var(--night); }
    body {

      min-height: 100vh;
      overflow-x: hidden;

      color: var(--text);

      letter-spacing: 0;

    button, textarea, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 48px; }

      border-radius: var(--radius-lg);

      box-shadow: 0 12px 34px rgba(0,0,0,.18);
      animation: surface-enter .34s cubic-bezier(.22,1,.36,1) both;

    .brand { display: flex; align-items: center; min-width: 0; gap: 2px; }
    .title { width: max-content; max-width: 100%; min-width: 0; padding-top: 3px; }

      pointer-events: none;
      user-select: none;

    h1 {

    .header-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .locale-picker { position: relative; z-index: 2147483646; }
    .locale-button {

      min-width: 154px;
      min-height: 40px;
      gap: 9px;

    .model-button[aria-expanded="true"] .chevron { transform: rotate(225deg) translate(-1px,-1px); }

    #modelCurrent { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-button:hover,
    .model-button:focus-visible,
    .model-button[aria-expanded="true"],
    input:focus {

      background-color: rgba(31,22,41,.7);

    }
    .model-menu {

      z-index: 1001;

      right: 0;
      left: 0;
      max-height: 260px;

      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: rgba(20,14,27,.99);

      animation: menu-enter .16s cubic-bezier(.22,1,.36,1) both;

    .model-menu[hidden] { display: none; }
    .model-option {

      align-items: center;
      width: 100%;
      min-height: 40px;
      gap: 10px;
      padding: 0 11px;
      border: 0;
      border-radius: 7px;
      background: transparent;

    .model-option::before {

    .model-option[aria-selected="true"]::before { border-color: var(--candle); background: var(--candle); }
    .annotation-editor {
      position: relative;
      width: 100%;
      min-height: 210px;
      border: 1px solid var(--line);

    .annotation-editor textarea {

    .expression-option {

    .expression-option:hover,

      100% { opacity: 1; transform: translateY(0); }
    }
    .actions { position: relative; display: flex; align-items: stretch; gap: 10px; }
    .primary, .stop { min-height: 46px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 700; outline: none; transition: border-color .15s, background .15s, transform .15s, box-shadow .15s; }
    .primary {
      position: relative;
      flex: 1;
      border: 1px solid rgba(237,201,142,.36);
      background: linear-gradient(115deg, #9b3e65, #815a9c 66%, #b78aaa);
      color: #fff9fb;
      box-shadow: 0 13px 28px rgba(82,31,60,.32), inset 0 1px rgba(255,255,255,.16);
    }
    .primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
    .primary:focus-visible, .stop:focus-visible { box-shadow: 0 0 0 3px rgba(237,201,142,.16); }
    .stop { width: 48px; border: 1px solid var(--line); background: rgba(42,31,52,.56); color: var(--ivory); }
    .stop:hover:not(:disabled) { border-color: var(--line-strong); background: rgba(48,34,59,.78); }
    button:disabled, textarea:disabled { opacity: .42; cursor: not-allowed; transform: none; }
    .status { min-height: 20px; margin-top: 12px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .status.live { color: var(--rose); }
    .status.error { color: var(--danger); }
    .progress { height: 2px; margin-top: 7px; overflow: hidden; border-radius: 2px; background: rgba(236,214,232,.07); }
    .progress > div { width: 0; height: 100%; border-radius: inherit; background: var(--rose); }
    .progress.active > div { width: 48%; animation: drift 1.35s ease-in-out infinite; }
    @keyframes drift { from { transform: translateX(-110%); } to { transform: translateX(315%); } }
    .side-panel { overflow: hidden; border-radius: var(--radius-lg); animation: surface-enter .38s .08s cubic-bezier(.22,1,.36,1) both; }
    .side-title {
      display: flex;
      align-items: center;
      min-height: 50px;
      gap: 9px;
      padding: 0 17px;
      border-bottom: 1px solid var(--line);
      color: var(--ivory);
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: 14px;
      font-weight: 600;
    }
    .side-title::before {
      width: 2px;
      height: 16px;
      border-radius: 1px;
      background: var(--candle);
      content: "";
    }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; }
    .metric {
      min-height: 92px;
      padding: 14px 15px;
      border-bottom: 1px solid var(--line);
      background: transparent;
    }
    .metric:nth-child(odd) { border-right: 1px solid var(--line); }
    .metric:nth-last-child(-n + 2) { border-bottom: 0; }
    .metric span { display: block; min-height: 28px; color: var(--faint); font-size: 10px; font-weight: 600; line-height: 1.35; letter-spacing: 0; }
    .metric strong {
      display: block;
      margin-top: 7px;
      color: var(--ivory);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 17px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .history { margin-top: 18px; animation: surface-enter .38s .12s cubic-bezier(.22,1,.36,1) both; }
    .history-heading { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; }
    .history h2 { margin: 0; color: var(--ivory); font-size: 13px; font-weight: 650; letter-spacing: 0; }
    .history-heading::after { height: 1px; flex: 1; background: var(--line); content: ""; }
    .table-wrap { overflow-x: auto; border-radius: var(--radius-md); }
    table { width: 100%; min-width: 790px; border-collapse: collapse; }
    th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
    th { background: rgba(46,33,56,.34); color: var(--faint); font-weight: 650; letter-spacing: 0; }
    td { color: #d9d0dd; }
    th:first-child, td:first-child {
      max-width: 350px;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: rgba(187,165,220,.045); }
    @keyframes surface-enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes menu-enter {
      from { opacity: 0; transform: translateY(-5px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes selection-settle {
      0% { transform: scale(.97); }
      100% { transform: scale(1); }
    }
    @media (max-width: 880px) {
      header { flex-direction: column; gap: 16px; }
      .header-tools { width: 100%; align-items: stretch; }
      .locale-picker { align-self: flex-end; }
      .badges { justify-content: flex-start; max-width: none; }
      .workspace { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      main { width: min(100% - 24px,1180px); padding-top: 12px; }
      header { gap: 15px; padding: 16px; border-radius: var(--radius-lg); }
      h1 { font-size: clamp(18px,5.8vw,31px); }
      .brand { gap: 0; }
      .brand-gif { height: clamp(44px,14vw,58px); margin: -6px 0 -6px -1px; }
      .editor { padding: 16px; border-radius: var(--radius-lg); }
      .voice-row { grid-template-columns: 1fr; gap: 7px; }
      .expression-card-button { max-width: calc(100vw - 112px); }
      .expression-menu { grid-template-columns: 1fr; }
      .annotation-caption { max-width: 170px; }
      .locale-picker, .locale-button, .locale-menu { width: 100%; }
      .badge { max-width: 100%; }
      .lang-row { display: flex; }
      .language-options { display: flex; width: 100%; }
      .lang { min-height: 44px; flex: 1 1 calc(33.333% - 3px); padding-inline: 8px; }
      .download-audio { width: 100%; min-height: 46px; margin-left: 0; }
      .model-button, .locale-button, .model-option, .locale-option { min-height: 44px; }
      .primary, .stop { min-height: 48px; }
      .metrics { grid-template-columns: 1fr; }
      .metric { min-height: 78px; border-right: 0 !important; }
      .metric:nth-last-child(2) { border-bottom: 1px solid var(--line); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

  <main>
    <header>
      <div class="brand">
        <div class="title">
          <h1>AnifLive-TTS WebUI</h1>
          <div class="title-rule" aria-hidden="true"></div>
        </div>

      </div>
      <div class="header-tools">
        <div class="locale-picker" id="localePicker">

            aria-haspopup="listbox" aria-expanded="false" aria-controls="localeMenu"
            data-i18n-aria-label="localeButtonAria">
            <span class="locale-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18M12 3c2.4 2.5 3.7 5.5 3.7 9S14.4 18.5 12 21M12 3c-2.4 2.5-3.7 5.5-3.7 9s1.3 6.5 3.7 9"></path>
              </svg>
            </span>
            <span id="localeCurrent">繁體中文</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div class="locale-menu" id="localeMenu" role="listbox"
            data-i18n-aria-label="localeMenuAria" hidden>
            <button class="locale-option" type="button" role="option" data-locale="en"
              aria-selected="false" tabindex="-1">English</button>
            <button class="locale-option" type="button" role="option" data-locale="zh-Hant"
              aria-selected="true" tabindex="-1">繁體中文</button>
            <button class="locale-option" type="button" role="option" data-locale="zh-Hans"
              aria-selected="false" tabindex="-1">简体中文</button>
          </div>
        </div>
        <div class="badges">
          <span class="badge" id="readyBadge" data-i18n="checkingService">檢查服務</span>
          <span class="badge" id="versionBadge">API v1</span>
          <span class="badge" id="backendBadge">TensorRT 11</span>
          <span class="badge" id="gpuBadge">GPU</span>
        </div>
      </div>
    </header>

    <section class="workspace">
      <div class="editor">
        <div class="voice-row">
          <label class="field-label" for="modelButton" data-i18n="voice">音色</label>

            <button class="model-button" id="modelButton" type="button" disabled
              aria-haspopup="listbox" aria-expanded="false" aria-controls="modelMenu"
              data-i18n-aria-label="modelAria">

        <div class="annotation-editor" id="annotationEditor">

        </div>
        <div class="expression-field">

            <button class="lang" type="button" data-language="zh" data-i18n="ttsLanguageZh">普通話</button>
            <button class="lang" type="button" data-language="yue" data-i18n="ttsLanguageYue">廣東話</button>
            <button class="lang" type="button" data-language="en" data-i18n="ttsLanguageEn">英語</button>
            <button class="lang" type="button" data-language="ko" data-i18n="ttsLanguageKo">韓語</button>
          </div>
          <button class="download-audio" id="downloadAudio" type="button" disabled
            data-i18n-aria-label="downloadAudioAria">
            <svg class="download-icon" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
              <path d="M9 2.5v8.2m-3-3 3 3 3-3M3.5 14.5h11"></path>
            </svg>
            <span id="downloadAudioLabel" data-i18n="downloadAudio">下載音訊</span>
          </button>
        </div>
        <div class="actions">
          <button class="primary" id="play" type="button" disabled><span data-i18n="play">立即播放</span></button>

        </div>

        <div class="progress" id="progress" aria-hidden="true"><div></div></div>
      </div>

      <aside class="side-panel">

          <div class="metric"><span data-i18n="metricTtfa">有效音訊 TTFA</span><strong id="ttfa">--</strong></div>
          <div class="metric"><span data-i18n="metricUpstream">上游首包延遲</span><strong id="upstream">--</strong></div>
          <div class="metric"><span data-i18n="metricArrival">估算可聽延遲</span><strong id="audible">--</strong></div>

          <div class="metric"><span data-i18n="metricProxy">首包傳輸開銷</span><strong id="proxy">--</strong></div>
          <div class="metric"><span data-i18n="metricUnderruns">播放緩衝欠載</span><strong id="underruns">0</strong></div>
        </div>
      </aside>
    </section>

    <section class="history">

        </table>
      </div>
    </section>

        firstAudibleSample: first,
        lastAudibleSample: last,
        firstAudibleContextTime: first < 0 ? NaN : scheduledStart + first / SAMPLE_RATE,
        lastAudibleContextTime: last < 0 ? NaN : scheduledStart + last / SAMPLE_RATE
      };
    }
    function showMetrics(m) {
      el("ttfa").textContent = fmtMs(m.activeChunkArrival);
      el("upstream").textContent = fmtMs(m.upstream);
      el("audible").textContent = fmtMs(m.audible);
      el("complete").textContent = fmtMs(m.complete);
      el("duration").textContent = Number.isFinite(m.duration) ? `${m.duration.toFixed(3)} s` : "--";
      el("rtf").textContent = Number.isFinite(m.rtf) ? m.rtf.toFixed(4) : "--";
      el("proxy").textContent = fmtMs(m.proxy);
      el("underruns").textContent = String(m.underruns || 0);
    }
    function addHistory(text, model, language, metrics) {
      state.history.unshift({ text, model, language, ...metrics });
      state.history = state.history.slice(0, 5);
      renderHistory();
    }
    function localizedError(error) {
      if (error?.i18nKey) return { key: error.i18nKey, vars: error.i18nVars || {} };
      const detail = error?.message || String(error || "");
      if (/still cancelling|仍在取消|仍在結束/.test(detail)) return { key: "errorBusy" };
      if (/not available locally|未安裝|未安装/.test(detail)) return { key: "errorModelUnavailable" };
      if (/expression profile|expression request|controlled expressions|No expression/i.test(detail)) {
        return { key: "errorExpression", vars: { detail } };
      }
      if (/body must|must not be empty|language must|limited to/i.test(detail)) return { key: "errorInvalidRequest" };
      if (/rejected|無法切換|stream ended|empty PCM|headers failed|invalid prebuffer/i.test(detail)) {
        return { key: "errorInvalidResponse" };
      }
      if (/connection|連線|连接|fetch/i.test(detail)) return { key: "errorConnection" };
      return { key: "errorUnknown", vars: { detail } };
    }
    function i18nError(key, vars = {}) {
      const error = new Error(key);
      error.i18nKey = key;
      error.i18nVars = vars;
      return error;
    }

    async function play() {
      if (state.switching || !state.model) return;
      if (state.controller) stopCurrent("");
      const sourceText = el("text").value;
      const text = sourceText.trim();
      if (!text) { setStatus("statusEnterText", "error"); return; }
      let segments = null;
      try {
        segments = annotationEditor.buildSegments();
      } catch (error) {
        setStatus("errorExpression", "error", { detail: String(error?.message || error) });
        return;
      }
      clearDownloadAudio();
      state.runId += 1;
      clearSources();
      const runId = state.runId;
      const context = await getAudioContext();
      const controller = new AbortController();
      state.controller = controller;
      state.muted = false;
      startPlaybackIndicator(sourceText, state.language, context, runId);
      el("play").disabled = true;
      const metrics = {
        activeChunkArrival: NaN, transportTtfa: NaN, upstream: NaN, audible: NaN,
        complete: NaN, duration: NaN, rtf: NaN, proxy: NaN, underruns: 0, prebufferMs: 32
      };
      showMetrics(metrics);
      el("stop").disabled = false;
      el("progress").classList.add("active");
      setStatus("statusGenerating", "live");
      const started = performance.now();
      let totalBytes = 0;
      let pcmBytes = 0;
      const pcmChunks = [];
      let carry = null;
      let firstAudibleContextTime = NaN;
      try {
        const response = await fetch("/api/speech", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(segments
            ? { segments, language: state.language, model: state.model }
            : { text, language: state.language, model: state.model }),
          signal: controller.signal,
          cache: "no-store"
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.error || `HTTP ${response.status}`);
        }
        if (
          response.headers.get("x-tensorrt-backend") !== "TensorRT-11" ||
          response.headers.get("x-pytorch-fallback") !== "false"
        ) throw i18nError("errorTensorRt");
        metrics.upstream = Number(response.headers.get("x-upstream-ttfa-ms"));
        metrics.prebufferMs = Number(response.headers.get("x-tts-recommended-prebuffer-ms")) || 32;
        const reader = response.body.getReader();
        while (true) {
          const { value, done } = await reader.read();
          if (runId !== state.runId) return;
          if (done) break;
          if (!value || !value.byteLength) continue;
          const chunkArrivalMs = performance.now() - started;
          if (!Number.isFinite(metrics.transportTtfa)) {
            metrics.transportTtfa = chunkArrivalMs;
            metrics.proxy = Math.max(0, metrics.transportTtfa - metrics.upstream);
          }
          totalBytes += value.byteLength;
          let chunk = value;
          if (carry !== null) {
            const joined = new Uint8Array(value.byteLength + 1);
            joined[0] = carry;
            joined.set(value, 1);
            chunk = joined;
            carry = null;
          }
          if (chunk.byteLength % 2) {
            carry = chunk[chunk.byteLength - 1];
            chunk = chunk.subarray(0, chunk.byteLength - 1);
          }
          if (chunk.byteLength) {
            const savedChunk = chunk.slice();
            pcmChunks.push(savedChunk);
            pcmBytes += savedChunk.byteLength;
          }
          if (chunk.byteLength && !state.muted) {
            const timing = schedulePcm(context, chunk, metrics);
            if (
              !Number.isFinite(firstAudibleContextTime)
              && Number.isFinite(timing.firstAudibleContextTime)
            ) {
              firstAudibleContextTime = timing.firstAudibleContextTime;
              if (state.playback?.runId === runId) {
                state.playback.firstAudibleContextTime = firstAudibleContextTime;
              }
              metrics.activeChunkArrival = chunkArrivalMs;
              const outputLatency = (context.outputLatency || context.baseLatency || 0) * 1000;
              metrics.audible = performance.now() - started
                + Math.max(0, firstAudibleContextTime - context.currentTime) * 1000
                + outputLatency;
              setStatus("statusStreaming", "live", { model: state.model });
            }
            if (state.playback?.runId === runId) {
              if (Number.isFinite(timing.lastAudibleContextTime)) {
                state.playback.lastAudibleContextTime = Math.max(
                  Number.isFinite(state.playback.lastAudibleContextTime)
                    ? state.playback.lastAudibleContextTime
                    : timing.lastAudibleContextTime,
                  timing.lastAudibleContextTime
                );
              }
              state.playback.receivedDurationSeconds = pcmBytes / 2 / SAMPLE_RATE;
            }
            showMetrics(metrics);
          }
        }
        if (carry !== null) throw i18nError("errorIncompletePcm");
        if (!Number.isFinite(metrics.activeChunkArrival)) throw i18nError("errorNoAudibleAudio");
        metrics.complete = performance.now() - started;
        metrics.duration = totalBytes / 2 / SAMPLE_RATE;
        metrics.rtf = metrics.complete / 1000 / metrics.duration;
        if (state.playback?.runId === runId) {
          const acoustic = globalThis.AnifLiveTTSPlaybackModel.buildPcmActivityTimeline(
            pcmChunks,
            SAMPLE_RATE
          );
          state.playback.acousticTimeline = (
            globalThis.AnifLiveTTSPlaybackModel.alignTextTimelineToAudio(
              state.playback.timeline,
              acoustic
            )
          );
          state.playback.responseComplete = true;
          if (
            Number.isFinite(state.playback.firstAudibleContextTime)
            && Number.isFinite(state.playback.lastAudibleContextTime)
          ) {
            state.playback.actualDurationSeconds = Math.max(
              1 / SAMPLE_RATE,
              state.playback.lastAudibleContextTime
                - state.playback.firstAudibleContextTime
                + 1 / SAMPLE_RATE
            );
          }
        }
        showMetrics(metrics);
        state.download = {
          blob: createWavBlob(pcmChunks, pcmBytes),
          fileName: downloadFileName(state.model, state.language)
        };
        el("downloadAudio").disabled = false;
        addHistory(text, state.model, state.language, metrics);
        setStatus(state.muted ? "statusStoppedReady" : "statusReceived", "", {
          duration: metrics.duration.toFixed(2)
        });
      } catch (error) {
        clearPlaybackIndicator();
        if (error.name !== "AbortError") {
          const translated = localizedError(error);
          setStatus(translated.key, "error", translated.vars || {});
        }
      } finally {
        if (runId === state.runId) {
          state.controller = null;
          updatePlayAvailability();
          el("stop").disabled = state.sources.length === 0;
          el("progress").classList.remove("active");
        }
      }
    }

    document.querySelectorAll(".lang").forEach(button => button.addEventListener("click", () => {
      document.querySelectorAll(".lang").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
      state.language = button.dataset.language;
      annotationEditor.setLanguage(state.language);
    }));
    el("play").addEventListener("click", play);
    el("stop").addEventListener("click", () => stopCurrent("statusCancelled"));
    el("downloadAudio").addEventListener("click", downloadCompletedAudio);
    el("text").addEventListener("input", clearPlaybackIndicator);
    el("text").addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        play();
      }
    });
    function applyStatus(data) {
      const health = data.health;
      state.models = Array.isArray(data.models) ? data.models : [];
      state.model = health.model;
      state.expressions = data.expressions || { enabled: false, profiles: [], policies: [] };
      state.apiVersion = data.api_version || "";
      renderModels();
      el("readyBadge").textContent = t("ready");
      el("readyBadge").classList.add("ready");
      el("versionBadge").textContent = `API v${data.api_version}`;
      el("backendBadge").textContent = `${health.backend} · ${health.engine_count} engines`;
      el("gpuBadge").textContent = health.gpu?.name || "GPU ready";
      annotationEditor.setDisabled(false);
      annotationEditor.setCatalog(state.expressions, state.language);
      updatePlayAvailability();
      el("modelButton").disabled = state.models.length < 2;
    }
    async function switchModel(target) {
      if (!target || target === state.model || state.switching) return;
      stopCurrent("");
      state.switching = true;
      closeModelMenu();
      el("modelButton").disabled = true;
      annotationEditor.setDisabled(true);
      el("play").disabled = true;
      el("progress").classList.add("active");
      setStatus("statusSwitching", "live", { current: state.model, target });
      try {
        const response = await fetch("/api/models/activate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: target }),
          cache: "no-store"
        });
        const data = await response.json();
        if (!response.ok || !data.ready) throw new Error(data.error || `HTTP ${response.status}`);
        applyStatus(data);
        setStatus("statusActivated", "", { model: state.model });
      } catch (error) {
        renderModels();
        const translated = localizedError(error);
        setStatus(translated.key, "error", translated.vars || {});
      } finally {
        state.switching = false;
        el("progress").classList.remove("active");
        annotationEditor.setDisabled(false);
        updatePlayAvailability();
        el("modelButton").disabled = state.models.length < 2;
      }
    }

    applyTranslations();
    fetch("/api/status", { cache: "no-store" }).then(async response => {
      const data = await response.json();
      if (!response.ok || !data.ready) {
        if (data.error) throw new Error(data.error);
        throw i18nError("errorServiceNotReady");
      }
      applyStatus(data);
      setStatus("statusApiReady", "", { model: state.model, version: state.apiVersion });
    }).catch(error => {
      const translated = localizedError(error);
      setStatus(translated.key, "error", translated.vars || {});
    });
  </script>
</body>
</html>
