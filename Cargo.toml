[workspace]
members = [
    "rust/aniflive-tts-client",
    "rust/aniflive-tts-python",
]
resolver = "3"

[workspace.package]
version = "1.5.0-beta.1"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.98"

[workspace.dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
thiserror = "=2.0.20"
url = "=2.5.8"

reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
